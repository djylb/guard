version: "2"

linters:
  default: all
  disable:
    # Formatting and naming style that gofmt and the code's idiom already
    # settle: blank-line placement, short names in short scopes, the
    # if err := f(); err != nil form, embedded-field spacing.
    - wsl
    - wsl_v5
    - nlreturn
    - varnamelen
    - noinlineerr
    - embeddedstructfieldcheck
    - lll
    # Zero values are ready to use throughout the package; literals name
    # only the fields they set.
    - exhaustruct
    - exhaustruct_v5
    # Functions are ordered by topic, next to the code they serve.
    - funcorder
    # The hot paths are written out in one function on purpose, so that
    # the fast path stays inlined and free of calls; size metrics flag
    # exactly those.
    - cyclop
    - gocognit
    - gocyclo
    - nestif
    - funlen
    - maintidx
    # Tests measure timing and use synctest bubbles; running them in
    # parallel would distort what they measure. Internal tests need the
    # package's unexported state.
    - paralleltest
    - tparallel
    - testpackage
    # Errors come back from the code that produced them, with their own
    # context.
    - wrapcheck
    # Named results document what a function returns.
    - nonamedreturns
    # Package state is the preallocated errors and a few tables.
    - gochecknoglobals
    # Constants are explained where they are used.
    - mnd
    # Pool entries are always the type the pool's New function makes.
    - forcetypeassert
    # Import rules are checked by deps_test.go.
    - depguard
    # Deprecated, replaced by gomodguard_v2.
    - gomodguard
  settings:
    govet:
      enable-all: true
      disable:
        # Checked on its own, as fieldalignment; what remains are
        # pointer-byte reports, for which fields keep their order of
        # meaning.
        - fieldalignment
    exhaustive:
      default-signifies-exhaustive: true
    tagliatelle:
      case:
        rules:
          # The configuration files are snake_case.
          json: snake
    recvcheck:
      # Marshalling takes the value so that a Config in a struct marshals
      # too; decoding needs the pointer.
      exclusions:
        - "*.MarshalJSON"
        - Key.IsZero
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Tests build errors in place, repeat their case names and unpack
      # fixtures they partly ignore; they open files and run the test
      # binary by path.
      - path: (_test\.go|internal/leakcheck/)
        linters:
          - err113
          - goconst
          - dogsled
      # Configuration and key errors name the offending field or index for
      # the log; the callers match them through ErrInvalidConfig, not by
      # identity.
      - path: internal/(conf|sign)/
        linters:
          - err113
      # Examples print what their Output comment shows.
      - path: example_test\.go
        linters:
          - forbidigo
      # httptest requests are never sent over a network; there is nothing for
      # a context to cancel.
      - path: _test\.go
        linters:
          - noctx
        text: httptest\.NewRequest
      - path: _test\.go
        linters:
          - gosec
        text: "G204|G304"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
